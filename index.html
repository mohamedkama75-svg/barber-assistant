<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barber X - Assistant</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: #1d1d1d;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    #chat {
      height: 350px;
      overflow-y: auto;
      background: #111;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .message {
      margin: 10px 0;
      padding: 10px 13px;
      border-radius: 10px;
      line-height: 1.4;
    }

    .user {
      background: #333;
      text-align: right;
    }

    .bot {
      background: #222;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>💈 Barber X</h1>
    <div class="subtitle">Assistant du salon</div>

    <div id="chat">
      <div class="message bot">
        Bonjour 👋 Je suis l'assistant de Barber X. Comment puis-je vous aider ?
      </div>
    </div>

    <div class="input-area">
      <input
        id="question"
        type="text"
        placeholder="Posez votre question..."
        onkeydown="if(event.key === 'Enter') sendQuestion()"
      >

      <button onclick="sendQuestion()">Envoyer</button>
    </div>
  </div>

  <script>
    const WORKER_URL =
      "https://barber-ai-server.mohamedkama75.workers.dev";

    async function sendQuestion() {
      const input = document.getElementById("question");
      const chat = document.getElementById("chat");

      const question = input.value.trim();

      if (!question) return;

      // Afficher le message du client
      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = question;
      chat.appendChild(userMessage);

      input.value = "";

      // Message temporaire
      const loadingMessage = document.createElement("div");
      loadingMessage.className = "message bot";
      loadingMessage.textContent = "Je réfléchis...";
      chat.appendChild(loadingMessage);

      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question: question
          })
        });

        const data = await response.json();

        loadingMessage.remove();

        const botMessage = document.createElement("div");
        botMessage.className = "message bot";

        if (data.answer) {
          botMessage.textContent = data.answer;
        } else {
          botMessage.textContent =
            "Désolé, une erreur est survenue.";
        }

        chat.appendChild(botMessage);

      } catch (error) {
        loadingMessage.textContent =
          "Impossible de contacter l'assistant pour le moment.";
      }

      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
